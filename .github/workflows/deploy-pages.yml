name: Build and deploy Pages

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Check out latest data submodule
              uses: actions/checkout@v4
              with:
                  repository: CINTEC-6arts/vex-attendance-system-data
                  ref: main
                  token: ${{ secrets.DATA_SUBMODULE_READ_TOKEN }}
                  path: vex-attendance-system-data
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build site
              run: bun run build
            - name: Generate GitHub context JSON
              run: |
                  echo '${{ toJson(github) }}' | jq '{job, ref, sha, repository, repository_Url, run_id, run_number, run_attempt, artifact_cache_size_limit, actor, trigerring_actor, workflow, event_name, event, ref_name, ref_protected, ref_type, secret_source, workflow_ref, workflow_sha, workspace}' | jq 'del(.event.base_ref, .event.organization, .event.repository, .event.sender)' > dist/github-context.json
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
