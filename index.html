<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>VEX Attendance System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0" rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="shell">
            <p class="eyebrow">Attendance</p>
            <h1>Take attendance</h1>
            <p class="intro">Find a person by team, division, or name, then mark them present or absent.</p>

            <div class="control-toolbar-wrapper">
                <section class="control-toolbar" aria-label="Attendance search and controls">
                    <label class="select-wrap event-select-wrap">
                        <select id="event-filter" aria-label="Choose event">
                            <option value="">Loading events...</option>
                        </select>
                        <span class="material-symbols-outlined select-arrow" aria-hidden="true">expand_more</span>
                    </label>
                    <div class="actions">
                        <button id="reset-attendance" class="action-button secondary danger icon-action" type="button" aria-label="Reset event attendance" title="Reset event attendance">
                            <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
                        </button>
                    </div>
                    <div class="search-wrap">
                        <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
                        <input id="search" type="search" placeholder="Search by team, division, or name..." autocomplete="off" aria-label="Search by team, division, or name" />
                        <button id="clear" class="clear-button" type="button" aria-label="Clear search">
                            <span class="material-symbols-outlined" aria-hidden="true">close</span>
                        </button>
                    </div>
                    <label class="select-wrap">
                        <select id="team-filter" aria-label="Filter by team">
                            <option value="">All teams</option>
                        </select>
                        <span class="material-symbols-outlined select-arrow" aria-hidden="true">expand_more</span>
                    </label>
                    <label class="select-wrap">
                        <select id="division-filter" aria-label="Filter by division">
                            <option value="">All divisions</option>
                        </select>
                        <span class="material-symbols-outlined select-arrow" aria-hidden="true">expand_more</span>
                    </label>
                    <label class="select-wrap">
                        <select id="status-filter" aria-label="Filter by attendance status">
                            <option value="">All statuses</option>
                            <option value="unprocessed">Unprocessed</option>
                            <option value="present">Present</option>
                            <option value="absent">Absent</option>
                            <option value="flagged">Flagged</option>
                        </select>
                        <span class="material-symbols-outlined select-arrow" aria-hidden="true">expand_more</span>
                    </label>
                    <button id="clear-filters" class="clear-filters icon-action" type="button" aria-label="Clear filters" title="Clear filters">
                        <span class="material-symbols-outlined" aria-hidden="true">filter_alt_off</span>
                    </button>
                    <button id="toggle-teams" class="clear-filters icon-action" type="button" aria-label="Expand all teams" title="Expand all teams">
                        <span id="toggle-teams-icon" class="material-symbols-outlined" aria-hidden="true">unfold_more</span>
                    </button>
                    <div class="toolbar">
                        <p id="result-count" class="result-count"></p>
                        <span id="status" class="status"></span>
                    </div>
                    <progress id="loading-progress" class="loading-progress" max="1" value="0" hidden aria-label="Loading event assets"></progress>
                </section>
            </div>

            <section id="results" class="results" aria-live="polite"></section>
            <p id="error" class="error" hidden></p>
        </main>

        <template id="organisation-template">
            <section class="organisation-group">
                <div class="organisation-heading">
                    <span class="material-symbols-outlined" aria-hidden="true">business</span>
                    <h2 class="organisation-name"></h2>
                    <span class="organisation-total"></span>
                </div>
                <div class="organisation-teams"></div>
            </section>
        </template>
        <template id="team-template">
            <section class="team-group collapsed">
                <div class="team-heading" role="button" tabindex="0" aria-expanded="false">
                    <div class="team-heading-content-wrapper">
                        <div class="team-heading-content">
                            <h2 class="team-code"></h2>
                            <span class="team-total"></span>
                        </div>
                        <span class="team-actions" aria-label="Set attendance for entire team">
                            <button class="team-action unprocessed" type="button" title="Mark entire team unprocessed" aria-label="Mark entire team unprocessed" data-team-status="unprocessed">
                                <span class="material-symbols-outlined" aria-hidden="true">question_mark</span>
                            </button>
                            <button class="team-action present" type="button" title="Confirm entire team present" aria-label="Confirm entire team present" data-team-status="present">
                                <span class="material-symbols-outlined" aria-hidden="true">check</span>
                            </button>
                            <button class="team-action absent" type="button" title="Confirm entire team absent" aria-label="Confirm entire team absent" data-team-status="absent">
                                <span class="material-symbols-outlined" aria-hidden="true">close</span>
                            </button>
                            <button class="team-action flagged" type="button" title="Flag entire team for a problem" aria-label="Flag entire team for a problem" data-team-status="flagged">
                                <span class="material-symbols-outlined" aria-hidden="true">flag</span>
                            </button>
                        </span>
                    </div>
                </div>
                <div class="team-members-wrapper">
                    <div class="team-members">
                        <div class="team-members-content"></div>
                    </div>
                </div>
            </section>
        </template>
        <template id="person-template">
            <article class="person-row">
                <div class="person-image-frame">
                    <img class="person-image" alt="" draggable="false" />
                </div>
                <span class="person-info">
                    <span class="person-name"></span>
                    <span class="person-meta"></span>
                    <span class="status-placeholder"></span>
                </span>
            </article>
        </template>
        <template id="status-button-template">
            <span class="status-controls" aria-label="Attendance status">
                <button class="status-button" type="button" data-status="unprocessed">
                    <span class="material-symbols-outlined" aria-hidden="true">question_mark</span>
                </button>
                <button class="status-button" type="button" data-status="present">
                    <span class="material-symbols-outlined" aria-hidden="true">check</span>
                </button>
                <button class="status-button" type="button" data-status="absent">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
                <button class="status-button" type="button" data-status="flagged">
                    <span class="material-symbols-outlined" aria-hidden="true">flag</span>
                </button>
            </span>
        </template>
        <template id="empty-template">
            <div class="empty">
                <h2>No matches found</h2>
                <p>Try a different team or name.</p>
            </div>
        </template>
        <template id="team-option-template">
            <option></option>
        </template>

        <script type="module" src="./script.ts"></script>
    </body>
</html>
